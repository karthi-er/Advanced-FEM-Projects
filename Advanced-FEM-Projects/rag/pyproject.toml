[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-demo"
version = "0.1.0"
description = "Local text chunking and retrieval with optional Anthropic answering"
requires-python = ">=3.10"

[project.optional-dependencies]
claude = ["anthropic>=0.40"]

[project.scripts]
rag-demo = "local_rag.cli:main"

[tool.setuptools]
packages = ["local_rag"]
