[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-export-analysis"
version = "0.1.0"
description = "Validation and completeness checks for CFD CSV exports"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["cfd_analysis"]

[project.scripts]
cfd-analysis = "cfd_analysis.cli:main"
